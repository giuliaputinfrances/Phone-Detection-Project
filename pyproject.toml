[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdp"
version = "0.1.0"
description = "YOLO26 obstacle detection pipeline: iPhone (Camo Studio) -> detection -> tracking -> servo commands"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4.0",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8.0"]

[project.scripts]
pdp = "pdp.cli:main"

[tool.setuptools.packages.find]
include = ["pdp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
