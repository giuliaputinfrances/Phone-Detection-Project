# Live run against the iPhone via Camo Studio.
#
# Before running: start Camo Studio, connect the iPhone over USB (not Wi-Fi —
# Wi-Fi adds jitter, which hurts a control loop more than constant delay), and
# lock exposure + white balance in Camo. Auto-exposure shifts the image
# statistics away from your training data and visibly moves confidence scores.
#
# `pdp cameras` lists the devices if the name below doesn't resolve.

name: live

source:
  kind: camo
  device: Camo          # matched by substring, not index — indices drift
  width: 1280
  height: 720
  fps: 60
  backend: dshow        # try msmf if dshow won't open the device
  fourcc: MJPG          # YUY2 silently caps throughput at 720p+
  threaded: true        # drop-oldest capture: fewer, current frames

detector:
  weights: yolo26n.pt   # swap for runs/detect/<run>/weights/best.pt
  device: auto
  imgsz: 640
  conf: 0.35            # higher than offline: fewer false servo triggers
  quantize: 16          # FP16 on CUDA; null for FP32, 8 for INT8
  tracker: bytetrack.yaml

policy:
  mode: pan_tilt
  min_conf: 0.45
  min_hits: 3
  max_misses: 5
  ema_alpha: 0.35       # smooths the measured error, not the servo angle
  pan_channel: 0
  tilt_channel: 1
  pan_range_deg: [-45.0, 45.0]
  tilt_range_deg: [-30.0, 30.0]
  # Closed loop: the camera rides on the rig, so the image gives the aiming
  # error, not the target's position. The field of view turns that error into
  # real degrees; gain is how much of it to correct per frame.
  # iPhone 15 main camera (26 mm equivalent) cropped to 16:9. Derived from the
  # optics, not measured here: verify it if aiming converges too slowly or
  # overshoots, because Camo can crop the frame and the ultra-wide lens is a
  # completely different number (~120 deg).
  fov_h_deg: 69.0
  fov_v_deg: 42.0
  gain: 0.5             # 1.0 corrects the whole error and overshoots
  deadzone_deg: 1.0
  invert_pan: false     # flip on first power-up if the rig drives away
  invert_tilt: false
  priority:
    person: 30
    cone: 20
    box: 10
    chair: 5
  zones:
    - {name: left,   x0: 0.0,  x1: 0.35}
    - {name: center, x0: 0.35, x1: 0.65}
    - {name: right,  x0: 0.65, x1: 1.0}

control:
  backend: none         # Phase 7: set to `serial` and fill in port
  port: COM3
  baud: 115200
  rate_hz: 50
  watchdog_ms: 500
  slew_dps: 180
  deadband_deg: 1.0
  neutral_deg: 0.0
  limits_deg:
    0: [-45.0, 45.0]
    1: [-30.0, 30.0]

sinks:
  preview: true         # q or esc to quit
  events_out: runs/live/events.jsonl
  draw_zones: true
  metrics_every: 120
